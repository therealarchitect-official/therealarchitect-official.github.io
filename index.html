<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheRealArchitect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg-1: #120303;
        --bg-2: #320808;
        --bg-3: #5b0707;
        --red-1: #ff3b3b;
        --red-2: #d60000;
        --red-3: #7a0000;
        --cream: #ffe7d7;
        --panel: rgba(20, 10, 10, 0.78);
        --line: rgba(255, 90, 90, 0.5);
        --shadow: rgba(0, 0, 0, 0.6);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 50% 20%, rgba(255,80,80,0.18), transparent 25%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 100%);
        color: var(--cream);
        font-family: "Righteous", sans-serif;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.04),
            rgba(255,255,255,0.04) 1px,
            transparent 1px,
            transparent 4px
          );
        pointer-events: none;
        mix-blend-mode: screen;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 32px 32px;
        pointer-events: none;
      }

      .pixel-shell {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 20px 80px;
      }

      .top-banner {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 900px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.9;
        color: rgba(255, 235, 235, 0.8);
      }

      .top-banner span {
        display: inline-block;
        padding: 6px 10px;
        border: 2px solid rgba(255, 70, 70, 0.7);
        background: rgba(20, 0, 0, 0.35);
        box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
      }

      .hero {
        position: relative;
        width: min(95vw, 1100px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 30px;
      }

      .title-wrap {
        position: relative;
        text-align: center;
        margin-top: 20px;
        animation: floaty 3.5s ease-in-out infinite;
      }

      .title-wrap::before {
        content: "TheRealArchitect";
        position: absolute;
        inset: 0;
        transform: translate(6px, 6px);
        color: rgba(0,0,0,0.55);
        z-index: 0;
        filter: blur(0.5px);
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 7.5rem);
        letter-spacing: 4px;
        line-height: 0.9;
        color: var(--red-1);
        text-shadow:
          0 0 0 #000,
          4px 4px 0 rgba(0,0,0,0.7),
          8px 8px 0 rgba(118, 0, 0, 0.85),
          0 0 22px rgba(255, 90, 90, 0.55);
        text-transform: uppercase;
        animation: flicker 2.2s steps(2, end) infinite;
      }

      .subtitle {
        margin-top: 18px;
        text-align: center;
        font-size: clamp(0.7rem, 1.6vw, 1.2rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(255, 225, 225, 0.8);
        text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
        margin-top: 26px;
      }

      .pixel-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        min-width: 170px;
        background: linear-gradient(180deg, #ff4d4d, #a90000);
        border: 3px solid rgba(255,255,255,0.35);
        color: #fff5f5;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.8rem;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.7), 8px 8px 0 rgba(0,0,0,0.7);
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .pixel-button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 3px rgba(0,0,0,0.7), 10px 10px 0 rgba(0,0,0,0.7);
        filter: brightness(1.08);
      }

      .pixel-button:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 3px rgba(0,0,0,0.7), 4px 4px 0 rgba(0,0,0,0.7);
      }

      .pixel-orb {
        position: absolute;
        border: 3px solid rgba(255,255,255,0.18);
        background: rgba(255, 50, 50, 0.12);
        animation: drift 7s ease-in-out infinite alternate;
      }

      .orb-1 {
        width: 100px;
        height: 100px;
        right: 8%;
        top: 18%;
      }

      .orb-2 {
        width: 70px;
        height: 70px;
        left: 10%;
        bottom: 15%;
        animation-delay: 1s;
      }

      .orb-3 {
        width: 120px;
        height: 120px;
        left: 20%;
        top: 10%;
        animation-delay: 2s;
      }

      .projects {
        width: min(1100px, 92vw);
        margin-top: 90px;
        padding: 18px 0 0;
        border-top: 4px solid rgba(255, 90, 90, 0.8);
      }

      .projects-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 20px;
      }

      .projects-header h2 {
        margin: 0;
        font-size: clamp(1.3rem, 4vw, 3rem);
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--red-1);
        text-shadow: 4px 4px 0 rgba(0,0,0,0.8);
      }

      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .project-card {
        position: relative;
        display: block;
        background: linear-gradient(180deg, rgba(30, 8, 8, 0.9), rgba(12, 2, 2, 0.95));
        border: 3px solid rgba(255, 90, 90, 0.5);
        padding: 20px 18px 18px;
        min-height: 220px;
        box-shadow: 8px 8px 0 rgba(0,0,0,0.8);
        text-decoration: none;
        color: var(--cream);
        transition: transform 0.12s ease, border-color 0.12s ease;
      }

      .project-card:hover {
        transform: translate(-3px, -3px);
        border-color: rgba(255, 125, 125, 0.9);
      }

      .project-card::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(255,255,255,0.12);
      }

      .project-tag {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 10px;
        background: rgba(255, 80, 80, 0.15);
        border: 2px solid rgba(255, 90, 90, 0.7);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.62rem;
      }

      .project-card h3 {
        margin: 0 0 12px;
        font-size: clamp(1.1rem, 2vw, 2rem);
        line-height: 1.15;
        text-transform: uppercase;
        color: #ffd2d2;
      }

      .project-card p {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.96rem;
        line-height: 1.6;
        color: rgba(255,235,235,0.85);
      }

      .project-card .arrow {
        position: absolute;
        right: 18px;
        bottom: 18px;
        font-size: 2rem;
        color: var(--red-1);
      }

      @keyframes drift {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-12px, 14px) scale(1.05); }
        100% { transform: translate(10px, -10px) scale(0.98); }
      }

      @keyframes floaty {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
          opacity: 1;
          text-shadow:
            0 0 0 #000,
            4px 4px 0 rgba(0,0,0,0.7),
            8px 8px 0 rgba(118, 0, 0, 0.85),
            0 0 22px rgba(255, 90, 90, 0.55);
        }
        20%, 24%, 55% {
          opacity: 0.9;
          text-shadow:
            0 0 0 #000,
            4px 4px 0 rgba(0,0,0,0.7),
            8px 8px 0 rgba(118, 0, 0, 0.85),
            0 0 22px rgba(255, 90, 90, 0.35);
        }
      }

      @media (max-width: 700px) {
        .top-banner {
          font-size: 10px;
          letter-spacing: 2px;
        }

        .cta-row {
          flex-direction: column;
        }

        .pixel-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="pixel-shell">
      <div class="top-banner">
        <span>Game Dev</span>
        <span>Portfolio</span>
      </div>

      <div class="hero">
        <div class="pixel-orb orb-1"></div>
        <div class="pixel-orb orb-2"></div>
        <div class="pixel-orb orb-3"></div>

        <div class="title-wrap">
          <h1>TheRealArchitect</h1>
        </div>

        <div class="subtitle">Designing systems. Building worlds.</div>

        <div class="cta-row">
          <a class="pixel-button" href="#projects">Projects</a>
          <a class="pixel-button" href="mailto:hello@example.com">Contact</a>
        </div>
      </div>

      <section class="projects" id="projects">
        <div class="projects-header">
          <h2>Projects</h2>
        </div>

        <div class="projects-grid">
          <a class="project-card" href="https://fried-guess-12209322.figma.site" target="_blank" rel="noopener noreferrer">
            <div class="project-tag">Concept</div>
            <h3>ZenithOS</h3>
            <p>A futuristic operating-system concept blending product strategy, cinematic interfaces, and clean systems thinking into one compelling digital experience.</p>
            <div class="arrow">→</div>
          </a>
        </div>
      </section>
    </div>
  </body>
</html>
