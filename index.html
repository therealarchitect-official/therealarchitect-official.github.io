<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="TheRealArchitect — three portfolios, one terminal. Explore web projects, Geometry Dash, and Munet Dash.">
  <title>TheRealArchitect // Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #090909;
      --fg: #ff2a2a;
      --dim: #bd2424;
      --accent: #ff6868;
      --line: #702020;
      --glow: rgba(255, 42, 42, .48);
      --font: "VT323", monospace;
      --pixel: "Press Start 2P", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 22px; text-shadow: 0 0 7px var(--glow); }
    body[data-theme="gd"] { --bg: #04090b; --panel: #071114; --fg: #50f6f2; --dim: #71b9aa; --accent: #ffd44f; --line: #216d69; --glow: rgba(80, 246, 242, .43); }
    body[data-theme="md"] { --bg: #08050d; --panel: #100a18; --fg: #d7a8ff; --dim: #a87bd1; --accent: #ffcf69; --line: #654282; --glow: rgba(215, 168, 255, .45); }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:hover { color: var(--fg); }
    button, input { color: inherit; font: inherit; }
    .crt { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: .14; background: repeating-linear-gradient(to bottom, transparent 0 2px, #000 3px 4px); }
    .crt::after { position: absolute; inset: 0; content: ""; background: radial-gradient(ellipse at center, transparent 55%, #000 115%); }
    .shell { width: min(940px, calc(100% - 32px)); min-height: 100vh; margin: auto; padding: 28px 0 32px; display: flex; flex-direction: column; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; padding: 0 0 14px; border-bottom: 1px solid var(--line); font-size: 18px; }
    .brand { color: var(--accent); letter-spacing: 2px; }
    .status { color: var(--dim); text-align: right; }
    .screen { flex: 1; min-height: 310px; padding: 18px 4px; overflow-wrap: anywhere; }
    .line { margin: 0 0 8px; white-space: pre-wrap; line-height: 1.17; }
    .banner { color: var(--accent); font-size: clamp(12px, 2.5vw, 21px); line-height: 1.2; text-shadow: 0 0 10px var(--glow); }
    .guide { margin: 18px 0 10px; color: var(--dim); }
    .command-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 5px 0 14px; }
    .cmd { border: 1px solid var(--line); background: var(--panel); color: var(--accent); padding: 4px 9px; cursor: pointer; font-size: 20px; text-shadow: inherit; }
    .cmd:hover, .cmd:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
    .output { padding: 14px 0; border-top: 1px dashed var(--line); }
    .output h2 { margin: 4px 0 12px; color: var(--accent); font: 12px/1.8 var(--pixel); }
    .output h3 { margin: 15px 0 4px; color: var(--accent); font-size: 24px; }
    .output p { margin: 5px 0 10px; line-height: 1.25; }
    .output ul { margin: 5px 0 14px; padding-left: 25px; }
    .output li { margin: 4px 0; }
    .input-area { display: flex; align-items: center; gap: 10px; padding: 11px 4px 0; border-top: 1px solid var(--line); }
    .prompt { color: var(--accent); }
    #command-input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; caret-color: var(--accent); font-size: 23px; text-shadow: inherit; }
    #command-input::placeholder { color: var(--dim); opacity: .8; }
    .cursor { display: inline-block; width: 10px; height: 1em; margin-left: 4px; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
    .hint { margin: 7px 0 0 4px; color: var(--dim); font-size: 18px; }
    body.flicker::before { content: ""; position: fixed; z-index: 4; inset: 0; pointer-events: none; background: var(--fg); opacity: 0; animation: channel .32s steps(4) both; }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes channel { 0%, 100% { opacity: 0; } 20% { opacity: .28; } 45% { opacity: .04; } 70% { opacity: .18; } }
    @media (max-width: 560px) { body { font-size: 20px; } .shell { width: calc(100% - 24px); padding-top: 18px; } .topbar { font-size: 16px; } .screen { padding-top: 14px; } .cmd { min-height: 42px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body data-theme="default">
  <div class="crt" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar"><span class="brand">[ THE REAL ARCHITECT ]</span><span class="status" id="theme-status">SIGNAL: DEFAULT</span></header>
    <section class="screen" id="screen" aria-live="polite" aria-label="Terminal output"></section>
    <form class="input-area" id="terminal-form" autocomplete="off">
      <label class="prompt" for="command-input">&gt;</label>
      <input id="command-input" name="command" type="text" spellcheck="false" autocapitalize="off" placeholder="type a command..." aria-label="Enter a terminal command">
      <span class="cursor" aria-hidden="true"></span>
    </form>
    <p class="hint">ENTER: RUN &nbsp; / &nbsp; ↑↓: HISTORY &nbsp; / &nbsp; TAP ANY COMMAND</p>
  </main>
  <script>
    // Edit portfolio copy, links, and available commands here.
    const CONFIG = {
      links: {
        geometryDash: "https://therealarchitect-official.github.io/geometry-dash-web/",
        munetDash: "https://therealarchitect-official.github.io/munet-dash-web/",
        projects: "projects.html",
        github: "https://github.com/therealarchitect-official"
      },
      commands: ["default", "gd", "md", "lore", "story", "credits", "help", "clear", "vault"],
      start: [
        "  _______ _   _ _____   _____    _    _   _ ____ _____ _   _ _____ _____ ____  ",
        " |_   _| | | | ____| | ____|  / \\  | \\ | |  _ \\_   _| | | | ____| ____|  _ \\ ",
        "   | | | |_| |  _|   |  _|   / _ \\ |  \\| | | | || | | |_| |  _| |  _| | |_) |",
        "   |_|  \\___/|_____| |_|    /_/ \\_\\|_|\\__|_| |_| |_|  \\___/|_____|_____|____/ ",
        "",
        "                    3 PORTFOLIOS. ONE TERMINAL."
      ].join("\n"),
      pages: {
        default: {
          title: "THE REAL ARCHITECT // MAIN PORTFOLIO",
          body: `<p>Independent creator building playful web experiences, digital spaces, and game concepts. Pick a signal to explore a different corner of the work.</p><h3>WEB PROJECTS</h3><ul><li>Boredom Slasher — an arcade-style game</li><li>ZenithOS Concept — a digital environment concept</li><li>Endless Addictive Clicker — a one-more-click experiment</li><li>Odd Spot! — a small creature hunt</li></ul><p><a href="${"${CONFIG.links.projects}"}">Browse the project collection ↗</a> &nbsp; <a href="${"${CONFIG.links.github}"}" target="_blank" rel="noopener noreferrer">GitHub ↗</a></p><p>Try <button class="cmd" data-command="gd">gd</button> or <button class="cmd" data-command="md">md</button> to switch worlds.</p>`
        },
        gd: {
          title: "REALARCHITECTGD // GEOMETRY DASH ARCHIVE",
          body: `<p>Geometry Dash ideas, levels, IDs, and collaborations — presented as a portfolio preview. Level names, IDs, and collab details can be added here as the archive is filled in.</p><h3>LEVELS / IDs</h3><p>Level archive: awaiting entries. No level IDs have been supplied for this portfolio yet.</p><h3>COLLABS</h3><p>Collaboration roster: ready for credits and contributor links.</p><p><a href="${"${CONFIG.links.geometryDash}"}" target="_blank" rel="noopener noreferrer">Open Geometry Dash Web portfolio ↗</a></p><p>Inspired by browser-based Geometry Dash creations. Enter <button class="cmd" data-command="lore">lore</button> for the origin story.</p>`
        },
        md: {
          title: "ARCHITECTMUNET // MUNET DASH",
          body: `<p>A fan-made Munet Dash Web project by TheRealArchitect, building a playable browser home for Munet Dash.</p><h3>PROJECT NOTES</h3><ul><li>Custom assets made for the Munet Dash world</li><li>Playable web project preview</li><li>Munet Dash credit: Munetios</li></ul><p><a href="${"${CONFIG.links.munetDash}"}" target="_blank" rel="noopener noreferrer">Launch Munet Dash Web preview ↗</a></p><p>Find the project origin with <button class="cmd" data-command="story">story</button> or view <button class="cmd" data-command="credits">credits</button>.</p>`
        },
        lore: {
          title: "ORIGIN LOG // LORE",
          body: `<p>It started with GDColon’s fan-made Geometry Dash running in a browser. That creative spark inspired TheRealArchitect to build a Geometry Dash portfolio and explore the game beyond the original format.</p><p>That path led to Munet Dash Web: a fan-made browser project created by TheRealArchitect, with Munet Dash credited to Munetios.</p><p>One browser experiment became three connected portfolio worlds.</p>`
        },
        credits: {
          title: "CREDITS // ATTRIBUTION",
          body: `<ul><li>Munet Dash Web = By TheRealArchitect</li><li>Geometry Dash Web = By GDColon</li><li>Munet Dash = Credits to Munetios</li></ul>`
        },
        vault: {
          title: "SECRET DIRECTORY // UNLOCKED",
          body: `<p>Access granted. One unreleased layout is hidden behind this riddle:</p><p><strong>I have four corners, but no square; I fall in time, but never land. What am I?</strong></p><p class="dim">No answer key. Some doors are better left as blueprints. Check back when the next layout escapes.</p>`
        }
      },
      messages: {
        unknown: "COMMAND NOT FOUND. Run help to list available commands.",
        cleared: "SCREEN CLEARED. The signal is still here. Try help.",
        help: "AVAILABLE COMMANDS"
      }
    };

    const screen = document.querySelector("#screen");
    const input = document.querySelector("#command-input");
    const form = document.querySelector("#terminal-form");
    const status = document.querySelector("#theme-status");
    const history = [];
    let historyIndex = 0;

    function addLine(text, className = "line") {
      const node = document.createElement("div");
      node.className = className;
      node.textContent = text;
      screen.append(node);
    }
    function addPage(page) {
      const article = document.createElement("article");
      article.className = "output";
      const heading = document.createElement("h2");
      heading.textContent = page.title;
      const content = document.createElement("div");
      // Page templates are authored in CONFIG above; command text remains centralized there.
      content.innerHTML = page.body;
      article.append(heading, content);
      screen.append(article);
    }
    function clickableCommands(commands = CONFIG.commands) {
      const row = document.createElement("div");
      row.className = "command-row";
      commands.forEach(command => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cmd";
        button.dataset.command = command;
        button.textContent = command;
        row.append(button);
      });
      return row;
    }
    function renderStart() {
      screen.replaceChildren();
      addLine(CONFIG.start, "line banner");
      addLine("BOOT SEQUENCE COMPLETE // WELCOME, ARCHITECT.");
      addLine("Choose a command below, tap it, or type it and press Enter.", "line guide");
      screen.append(clickableCommands(["default", "gd", "md", "lore", "credits", "help", "clear", "vault"]));
      addLine("Use ↑ / ↓ to revisit commands. Type help anytime for the full menu.");
    }
    function switchTheme(theme) {
      document.body.dataset.theme = theme;
      status.textContent = `SIGNAL: ${theme.toUpperCase()}`;
      document.body.classList.remove("flicker");
      void document.body.offsetWidth;
      document.body.classList.add("flicker");
      window.setTimeout(() => document.body.classList.remove("flicker"), 350);
    }
    function run(raw) {
      const command = raw.trim().toLowerCase();
      if (!command) return;
      addLine(`> ${command}`, "line prompt-line");
      if (command === "clear") {
        screen.replaceChildren();
        addLine(CONFIG.messages.cleared);
        return;
      }
      if (command === "default" || command === "gd" || command === "md") {
        switchTheme(command);
        addPage(CONFIG.pages[command]);
        return;
      }
      if (command === "help") {
        const article = document.createElement("article");
        article.className = "output";
        const heading = document.createElement("h2");
        heading.textContent = CONFIG.messages.help;
        article.append(heading, clickableCommands());
        const note = document.createElement("p");
        note.textContent = "Tap a command to run it. `story` is an alias for `lore`.";
        article.append(note);
        screen.append(article);
        return;
      }
      if (command === "lore" || command === "story") { addPage(CONFIG.pages.lore); return; }
      if (command === "credits") { addPage(CONFIG.pages.credits); return; }
      if (command === "vault") { addPage(CONFIG.pages.vault); return; }
      addLine(CONFIG.messages.unknown);
    }
    form.addEventListener("submit", event => {
      event.preventDefault();
      const value = input.value;
      if (!value.trim()) return;
      history.push(value.trim());
      historyIndex = history.length;
      run(value);
      input.value = "";
      screen.scrollTop = screen.scrollHeight;
    });
    input.addEventListener("keydown", event => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        historyIndex = event.key === "ArrowUp" ? Math.max(0, historyIndex - 1) : Math.min(history.length, historyIndex + 1);
        input.value = history[historyIndex] || "";
      }
    });
    screen.addEventListener("click", event => {
      const button = event.target.closest("[data-command]");
      if (!button) return;
      run(button.dataset.command);
      input.focus();
      screen.scrollTop = screen.scrollHeight;
    });
    document.addEventListener("click", event => {
      if (!event.target.closest("button, a, input")) input.focus();
    });
    renderStart();
    input.focus();
  </script>
</body>
</html>
